schema_version: "1.0"
workflow:
  id: speckit
  name: Full Feature Cycle
  version: 3.0.0
  author: model-planes
  description: "Runs specify → clarify → plan → checklist → tasks → analyze → review → implement"

requires:
  speckit_version: ">=0.8.8"
  integrations:
    any: ["codex"]

inputs:
  feature:
    type: string
    required: true
    prompt: "Describe the feature"
  epic:
    type: string
    required: false
    prompt: "Optional parent epic path"
  checklist_focus:
    type: string
    required: false
    default: "requirements completeness, evidence boundaries, and implementation readiness"
  integration:
    type: string
    default: codex

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature }} {{ inputs.epic }}"

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"

  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.checklist_focus }}"

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"

  - id: review
    type: gate
    message: "Confirm the constitution, specification, clarification record, plan artifacts, checklists, tasks, and any required ADRs are ready for implementation."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
