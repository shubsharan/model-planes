lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      oxfmt:
        specifier: ^0.61.0
        version: 0.61.0
      oxlint:
        specifier: ^1.76.0
        version: 1.77.0
      turbo:
        specifier: ^2.10.8
        version: 2.10.8
      typescript:
        specifier: 7.0.2
        version: 7.0.2

  packages/cli:
    dependencies:
      '@model-planes/harness':
        specifier: workspace:*
        version: link:../harness

  packages/controllers:
    dependencies:
      '@model-planes/core':
        specifier: workspace:*
        version: link:../core
      '@model-planes/sim':
        specifier: workspace:*
        version: link:../sim

  packages/core: {}

  packages/harness:
    dependencies:
      '@model-planes/controllers':
        specifier: workspace:*
        version: link:../controllers
      '@model-planes/core':
        specifier: workspace:*
        version: link:../core
      '@model-planes/scenarios':
        specifier: workspace:*
        version: link:../scenarios
      '@model-planes/sim':
        specifier: workspace:*
        version: link:../sim

  packages/scenarios:
    dependencies:
      '@model-planes/core':
        specifier: workspace:*
        version: link:../core
      '@model-planes/sim':
        specifier: workspace:*
        version: link:../sim

  packages/sim:
    dependencies:
      '@model-planes/core':
        specifier: workspace:*
        version: link:../core

